name: InstaLite

options:
  bundleIdPrefix: com.asilturkmen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  InstaLite:
    type: application
    platform: iOS
    sources:
      - path: InstaLite/App
      - path: InstaLite/Web
      - path: InstaLite/Offline
      - path: InstaLite/Resources
        buildPhase: resources
    info:
      path: InstaLite/Info.plist
      properties:
        CFBundleDisplayName: InstaLite
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Instagram web'de fotoğraf/video yüklerken dosya seçici kamerayı da sunar.
        NSCameraUsageDescription: Gönderi ve hikâye için fotoğraf ya da video çekmek.
        NSMicrophoneUsageDescription: Video çekerken ses kaydetmek.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  InstaLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InstaLiteTests
      - path: Tests/rules-cases.json
        buildPhase: resources
    dependencies:
      - target: InstaLite

schemes:
  InstaLite:
    build:
      targets:
        InstaLite: all
    test:
      targets:
        - InstaLiteTests
